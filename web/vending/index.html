<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacking Device</title>
  <script defer src="../alpinejs@3.15.11.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
  <link rel="stylesheet" href="dist.css">
  <link rel="stylesheet" href="style.css">
</head>
<body
  class="w-screen h-screen overflow-hidden font-mono select-none bg-hdark text-hgreen crt-screen"
  x-data="hackDevice"
>

  <!-- CRT overlays -->
  <div class="crt-vignette"></div>
  <div class="scanline-overlay"><div class="scan-line"></div></div>

  <!-- Boot / Loading Screen -->
  <div x-show="mode === 'boot'" x-cloak class="relative flex flex-col items-center justify-center w-full h-full gap-3 p-6">
    <div class="text-6xl font-black tracking-[0.3em] glow-text-strong boot-flicker">VND</div>
    <div class="text-xl font-bold tracking-[0.5em] uppercase text-hgreen/30">v3.1</div>

    <div class="w-full mt-3 space-y-0.5 max-h-44 overflow-hidden">
      <template x-for="(line, idx) in bootLines" :key="idx">
        <div class="text-sm truncate text-hgreen/40 boot-line" x-text="line"></div>
      </template>
    </div>

    <div class="w-full h-4 mt-4 overflow-hidden border bg-hgreen/5 border-hgreen/20">
      <div class="h-full transition-all duration-300 bg-hgreen/60 glow-bar"
           :style="{ width: bootProgress + '%' }"></div>
    </div>
    <div class="text-lg font-bold tracking-[0.2em] uppercase text-hgreen/40" x-text="bootStatus"></div>
  </div>

  <!-- Signal Strength View -->
  <div x-show="mode === 'signal'" x-cloak class="relative flex flex-col items-center justify-between w-full h-full px-5 py-6">

    <div class="flex items-center justify-between w-full">
      <div class="flex items-center gap-2">
        <div class="pulse-dot w-3.5 h-3.5 rounded-full bg-hgreen"></div>
        <span class="text-xl font-black tracking-[0.15em] uppercase glow-text">SCANNING</span>
      </div>
      <span class="text-base font-bold text-hgreen/30 tabular-nums" x-text="frequency"></span>
    </div>

    <div class="flex items-end justify-center flex-1 w-full gap-2 py-5">
      <template x-for="i in 8" :key="i">
        <div
          class="flex-1 transition-all duration-300 max-w-14"
          :class="i <= signalLevel
            ? 'bg-hgreen/80 border border-hgreen/50'
            : 'bg-hgreen/5 border border-hgreen/10'"
          :style="{ height: (i * 12.5) + '%' }"
        ></div>
      </template>
    </div>

    <div class="w-full text-center">
      <div class="text-4xl font-black tracking-wider glow-text-strong" x-text="signalLabel"></div>
      <div class="mt-1 text-2xl font-bold text-hgreen/25 tabular-nums" x-text="distanceText"></div>
    </div>
  </div>

  <!-- Terminal / Console View -->
  <div x-show="mode === 'terminal'" x-cloak class="relative flex flex-col w-full h-full overflow-hidden">

    <div class="flex items-center gap-2 px-4 py-2 border-b-2 border-hgreen/25 bg-hgreen/5 shrink-0">
      <div class="flex gap-1.5">
        <span class="w-3 h-3 rounded-full bg-hred/70"></span>
        <span class="w-3 h-3 rounded-full bg-hamber/70"></span>
        <span class="w-3 h-3 rounded-full bg-hgreen/70"></span>
      </div>
      <span class="ml-1 text-sm font-bold tracking-wider text-hgreen/30">VND@exploit:~$</span>
    </div>

    <div x-ref="terminalOutput" class="flex-1 px-4 py-3 overflow-y-auto terminal-scroll">
      <template x-for="(line, idx) in terminalLines" :key="idx">
        <div
          class="text-2xl font-bold leading-relaxed"
          :class="{
            'text-hgreen/50': line.type === 'info',
            'text-hgreen glow-text': line.type === 'success',
            'text-hamber': line.type === 'warning',
            'text-hred': line.type === 'error'
          }"
          x-text="line.text"
        ></div>
      </template>
      <div x-show="showCursor" class="text-xl text-hgreen">
        <span class="blink">█</span>
      </div>
    </div>

    <div class="px-4 py-3 border-t-2 border-hgreen/25 shrink-0 bg-hgreen/5">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xl font-black tracking-wider" :class="hackFailed ? 'text-hred' : 'text-hgreen/40'" x-text="progressLabel"></span>
        <span class="text-4xl font-black tabular-nums" :class="hackFailed ? 'text-hred glow-text-red' : 'glow-text-strong'" x-text="Math.round(hackProgress) + '%'"></span>
      </div>
      <div class="w-full h-6 overflow-hidden border" :class="hackFailed ? 'border-hred/30 bg-hred/5' : 'border-hgreen/20 bg-hgreen/5'">
        <div
          class="h-full transition-all duration-500"
          :class="hackFailed
            ? 'bg-hred/60'
            : (hackComplete ? 'bg-hgreen glow-bar' : 'bg-hgreen/60')"
          :style="{ width: hackProgress + '%' }"
        ></div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Result Overlay -->
  <div x-show="mode === 'result'" x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       class="absolute inset-0 z-50 flex flex-col items-center justify-center gap-4 p-6 bg-hdark"
  >
    <template x-if="resultSuccess">
      <div class="flex flex-col items-center gap-4">
        <svg class="w-24 h-24 text-hgreen result-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        <div class="text-5xl font-black tracking-wider glow-text-strong">ACCESS</div>
        <div class="text-5xl font-black tracking-wider glow-text-strong">GRANTED</div>
        <div class="text-lg font-bold text-hgreen/40">Payload delivered</div>
      </div>
    </template>
    <!-- BREACHED BUT EMPTY -->
    <template x-if="!resultSuccess && mode === 'result' && resultReason === 'no_loot'">
      <div class="flex flex-col items-center gap-4">
        <svg class="w-24 h-24 text-hamber result-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25zm0 0H9.75m2.25 0v7.5m0 0h2.25m-2.25 0H9.75"/>
        </svg>
        <div class="text-5xl font-black tracking-wider text-hamber" style="text-shadow:0 0 10px rgba(255,176,0,.6),0 0 30px rgba(255,176,0,.25),0 0 60px rgba(255,176,0,.1);">CASH BOX</div>
        <div class="text-5xl font-black tracking-wider text-hamber" style="text-shadow:0 0 10px rgba(255,176,0,.6),0 0 30px rgba(255,176,0,.25),0 0 60px rgba(255,176,0,.1);">EMPTY</div>
        <div class="text-lg font-bold" style="color:rgba(255,176,0,.3);">Nothing recovered</div>
        <div class="flex items-center gap-3 mt-1">
          <div class="w-2 h-2 rounded-full blink" style="background:rgba(255,176,0,.5);"></div>
          <div class="text-sm font-bold tracking-[0.3em] uppercase" style="color:rgba(255,176,0,.25);">Returning to scanner</div>
        </div>
      </div>
    </template>

    <!-- DEVICE STILL COOLING DOWN -->
    <template x-if="!resultSuccess && mode === 'result' && (resultReason === 'cooldown' || resultReason === 'already_hacking')">
      <div class="flex flex-col items-center gap-4">
        <svg class="w-24 h-24 text-hamber result-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <div class="text-5xl font-black tracking-wider text-hamber" style="text-shadow:0 0 10px rgba(255,176,0,.6),0 0 30px rgba(255,176,0,.25),0 0 60px rgba(255,176,0,.1);">DEVICE</div>
        <div class="text-5xl font-black tracking-wider text-hamber" style="text-shadow:0 0 10px rgba(255,176,0,.6),0 0 30px rgba(255,176,0,.25),0 0 60px rgba(255,176,0,.1);">COOLDOWN</div>
        <div class="text-lg font-bold" style="color:rgba(255,176,0,.3);">Overheated, wait a moment</div>
        <div class="flex items-center gap-3 mt-1">
          <div class="w-2 h-2 rounded-full blink" style="background:rgba(255,176,0,.5);"></div>
          <div class="text-sm font-bold tracking-[0.3em] uppercase" style="color:rgba(255,176,0,.25);">Returning to scanner</div>
        </div>
      </div>
    </template>

    <template x-if="!resultSuccess && mode === 'result' && resultReason !== 'no_loot' && resultReason !== 'cooldown' && resultReason !== 'already_hacking'">
      <div class="flex flex-col items-center gap-4">
        <div class="relative">
          <svg class="w-24 h-24 text-hred result-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
          </svg>
          <div class="absolute inset-0 rounded-full bg-hred/10 glitch-flash"></div>
        </div>
        <div class="text-5xl font-black tracking-wider text-hred glitch-text glow-text-red">CONNECTION</div>
        <div class="text-5xl font-black tracking-wider text-hred glitch-text glow-text-red">LOST</div>
        <div class="text-lg font-bold text-hred/30" x-text="resultReason || 'Signal interrupted'"></div>
        <div class="flex items-center gap-3 mt-1">
          <div class="w-2 h-2 rounded-full bg-hred/50 blink"></div>
          <div class="text-sm font-bold tracking-[0.3em] uppercase text-hred/25">Returning to scanner</div>
        </div>
      </div>
    </template>
  </div>

</body>
<script src="app.js"></script>
</html>
