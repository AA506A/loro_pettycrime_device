<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512, initial-scale=1.0">
  <title>DigiScanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script defer src="../alpinejs@3.15.11.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
  <link rel="stylesheet" href="dist.css">
  <link rel="stylesheet" href="style.css">
</head>
<body
  class="overflow-hidden font-mono select-none device-screen text-cyan"
  style="width:512px;height:512px;"
  x-data="hackDevice"
>

  <!-- Overlays (full 512x512 canvas) -->
  <div class="grid-overlay"></div>
  <div class="device-vignette"></div>
  <div class="sweep-overlay"><div class="sweep-line"></div></div>

  <!-- Safe area -->
  <div class="safe-area">

    <!-- ============ BOOT SCREEN ============ -->
    <div x-show="mode === 'boot'" x-cloak class="flex flex-col items-center justify-center gap-2 screen-panel">

      <!-- Diamond badge -->
      <div class="flex items-center justify-center mb-3 rotate-45 border-2 rounded-md border-cyan/20"
           style="width:100px;height:100px;">
        <div class="text-center -rotate-45">
          <div style="font-size:36px;" class="font-black tracking-widest glow-cyan-strong boot-flicker">DS</div>
          <div style="font-size:10px;" class="tracking-[0.3em] uppercase text-cyan/30 mt-px">v1.2.0</div>
        </div>
      </div>

      <!-- Boot log -->
      <div class="w-full space-y-px overflow-hidden" style="max-height:160px;">
        <template x-for="(line, idx) in bootLines" :key="idx">
          <div class="truncate boot-hex"
               style="font-size:13px;line-height:1.5;"
               :class="line.startsWith('[OK]') ? 'text-cyan/60' : 'text-cyan/25'"
               x-text="line"></div>
        </template>
      </div>

      <!-- Progress -->
      <div class="w-full mt-2">
        <div class="flex justify-between mb-1">
          <span style="font-size:11px;" class="uppercase tracking-[0.2em] text-cyan/30" x-text="bootStatus"></span>
          <span style="font-size:11px;" class="tabular-nums text-cyan/30" x-text="Math.round(bootProgress) + '%'"></span>
        </div>
        <div class="w-full overflow-hidden border border-cyan/10 bg-cyan/5" style="height:8px;">
          <div class="h-full transition-all duration-300 bg-cyan/50 glow-bar-cyan"
               :style="{ width: bootProgress + '%' }"></div>
        </div>
      </div>
    </div>

    <!-- ============ SIGNAL / RADAR SCREEN ============ -->
    <div x-show="mode === 'signal'" x-cloak class="flex flex-col items-center justify-between screen-panel">

      <!-- Top bar -->
      <div class="flex items-center justify-between w-full">
        <div class="flex items-center gap-1">
          <div class="rounded-full pulse-dot bg-cyan" style="width:8px;height:8px;"></div>
          <span style="font-size:14px;" class="font-bold tracking-[0.15em] uppercase glow-cyan">DIGI-SCAN</span>
        </div>
        <span style="font-size:12px;" class="tabular-nums text-cyan/25" x-text="frequency"></span>
      </div>

      <!-- Radar -->
      <div x-ref="radarContainer" class="my-2 radar-container">
        <div class="radar-ring radar-ring-1"></div>
        <div class="radar-ring radar-ring-2"></div>
        <div class="radar-ring radar-ring-3"></div>
        <div class="radar-crosshair-h"></div>
        <div class="radar-crosshair-v"></div>
        <div x-ref="sweepTrail" class="radar-sweep-trail"></div>
        <div x-ref="sweepLine" class="radar-sweep"></div>
        <div class="radar-center-dot"></div>
        <template x-for="(blip, idx) in blipPositions" :key="idx">
          <div class="radar-blip"
               :class="{
                 'radar-blip-primary': blip.primary && !blip.looted,
                 'radar-blip-secondary': !blip.primary && !blip.looted,
                 'radar-blip-looted': blip.looted
               }"
               :style="{ left: blip.left, top: blip.top }"></div>
        </template>
      </div>

      <!-- Signal readout -->
      <div class="w-full">
        <div class="flex items-baseline justify-between">
          <span style="font-size:22px;" class="font-black tracking-wider glow-cyan-strong" x-text="signalLabel"></span>
          <span style="font-size:15px;" class="tabular-nums text-cyan/20" x-text="distanceText"></span>
        </div>

        <!-- Mini bar meter -->
        <div class="flex gap-px mt-1" style="height:12px;">
          <template x-for="i in 8" :key="i">
            <div class="flex-1 transition-all duration-200"
                 :class="i <= signalLevel
                   ? 'bg-cyan/70 border border-cyan/40'
                   : 'bg-cyan/5 border border-cyan/8'"
            ></div>
          </template>
        </div>
      </div>

      <!-- Scrolling data ticker -->
      <div class="w-full pt-px border-t data-ticker border-cyan/8" style="height:14px;margin-top:4px;">
        <div class="tracking-wider data-ticker-inner text-cyan/15" style="font-size:8px;">
          0xA3F8 PKM-SCAN FREQ:433.2MHz CH:04 BW:20 SNR:--dB PWR:12mW SEC:AES256 MODE:PASSIVE 0xA3F8 PKM-SCAN FREQ:433.2MHz CH:04 BW:20 SNR:--dB PWR:12mW SEC:AES256 MODE:PASSIVE
        </div>
      </div>
    </div>

    <!-- ============ TERMINAL / HACK SCREEN ============ -->
    <div x-show="mode === 'terminal'" x-cloak class="flex flex-col p-0 overflow-hidden screen-panel">

      <!-- Header -->
      <div class="flex items-center justify-between px-3 border-b border-cyan/15 bg-cyan/[0.03] shrink-0" style="padding-top:5px;padding-bottom:5px;">
        <div class="flex items-center gap-1">
          <div class="rounded-full" style="width:7px;height:7px;" :class="hackFailed ? 'bg-cred/80' : 'bg-cyan/60 pulse-dot'"></div>
          <span style="font-size:12px;" class="font-bold tracking-[0.12em] uppercase text-cyan/30">exploit session</span>
        </div>
        <span style="font-size:11px;" class="tabular-nums text-cyan/20" x-text="'PID:' + sessionPid"></span>
      </div>

      <!-- Terminal output -->
      <div x-ref="terminalOutput" class="flex-1 px-3 py-2 overflow-y-auto terminal-scroll">
        <template x-for="(line, idx) in terminalLines" :key="idx">
          <div style="font-size:15px;line-height:1.6;"
               class="font-bold tracking-wide"
               :class="{
                 'text-cyan/40': line.type === 'info',
                 'text-cyan glow-cyan': line.type === 'success',
                 'text-camber': line.type === 'warning',
                 'text-cred': line.type === 'error'
               }"
               x-text="line.text"></div>
        </template>
        <div x-show="showCursor" class="text-cyan/50" style="font-size:14px;">
          <span class="blink">_</span>
        </div>
      </div>

      <!-- Progress bar area -->
      <div class="px-3 border-t border-cyan/15 shrink-0 bg-cyan/[0.03]" style="padding-top:6px;padding-bottom:6px;">
        <div class="flex items-center gap-3">
          <span style="font-size:28px;" class="font-black text-right tabular-nums"
                :class="hackFailed ? 'text-cred glow-red' : 'glow-cyan-strong'"
                x-text="Math.round(hackProgress) + '%'"></span>
          <div class="flex-1">
            <div class="flex justify-between mb-1">
              <span style="font-size:10px;" class="font-bold tracking-[0.12em] uppercase"
                    :class="hackFailed ? 'text-cred/60' : 'text-cyan/25'"
                    x-text="progressLabel"></span>
            </div>
            <div class="w-full overflow-hidden border"
                 style="height:8px;"
                 :class="hackFailed ? 'border-cred/20 bg-cred/5' : 'border-cyan/15 bg-cyan/5'">
              <div class="h-full transition-all duration-500"
                   :class="hackFailed
                     ? 'bg-cred/50'
                     : (hackComplete ? 'bg-cyan glow-bar-cyan' : 'bg-cyan/40')"
                   :style="{ width: hackProgress + '%' }"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ RESULT OVERLAY ============ -->
    <div x-show="mode === 'result'" x-cloak
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         class="flex flex-col items-center justify-center screen-panel bg-cdark"
         style="position:absolute;inset:0;z-index:50;"
    >
      <!-- SUCCESS -->
      <template x-if="resultSuccess">
        <div class="flex flex-col items-center gap-3">
          <svg class="text-cyan result-icon" style="width:72px;height:72px;" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
          </svg>
          <div style="font-size:34px;" class="font-black tracking-[0.15em] glow-cyan-strong">CRACKED</div>
          <div class="bg-cyan/20" style="width:60px;height:1px;"></div>
          <div style="font-size:12px;" class="tracking-[0.2em] uppercase text-cyan/30">exploit delivered</div>
        </div>
      </template>

      <!-- FAILURE -->
      <template x-if="!resultSuccess && mode === 'result'">
        <div class="flex flex-col items-center gap-3">

          <!-- ALREADY BREACHED -->
          <template x-if="resultReason === 'already_looted'">
            <div class="flex flex-col items-center gap-3">
              <svg class="text-camber result-icon" style="width:72px;height:72px;" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
              <div style="font-size:30px;" class="font-black tracking-[0.15em] text-camber glow-amber">BREACHED</div>
              <div class="bg-camber/20" style="width:60px;height:1px;"></div>
              <div style="font-size:12px;" class="tracking-[0.2em] uppercase text-camber/30">previously compromised</div>
              <div class="flex items-center gap-2 mt-1">
                <div class="rounded-full bg-camber/40 blink" style="width:5px;height:5px;"></div>
                <span style="font-size:9px;" class="tracking-[0.2em] uppercase text-camber/20">returning to scanner</span>
              </div>
            </div>
          </template>

          <!-- BREACHED BUT EMPTY -->
          <template x-if="resultReason === 'no_loot'">
            <div class="flex flex-col items-center gap-3">
              <svg class="text-camber result-icon" style="width:72px;height:72px;" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25zm0 0H9.75m2.25 0v7.5m0 0h2.25m-2.25 0H9.75"/>
              </svg>
              <div style="font-size:32px;" class="font-black tracking-[0.15em] text-camber glow-amber">EMPTY</div>
              <div class="bg-camber/20" style="width:60px;height:1px;"></div>
              <div style="font-size:12px;" class="tracking-[0.2em] uppercase text-camber/30">no funds recovered</div>
              <div class="flex items-center gap-2 mt-1">
                <div class="rounded-full bg-camber/40 blink" style="width:5px;height:5px;"></div>
                <span style="font-size:9px;" class="tracking-[0.2em] uppercase text-camber/20">returning to scanner</span>
              </div>
            </div>
          </template>

          <!-- CRACKER STILL COOLING DOWN -->
          <template x-if="resultReason === 'cooldown' || resultReason === 'already_hacking'">
            <div class="flex flex-col items-center gap-3">
              <svg class="text-camber result-icon" style="width:72px;height:72px;" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <div style="font-size:30px;" class="font-black tracking-[0.15em] text-camber glow-amber">COOLDOWN</div>
              <div class="bg-camber/20" style="width:60px;height:1px;"></div>
              <div style="font-size:12px;" class="tracking-[0.2em] uppercase text-camber/30">cracker overheated</div>
              <div class="flex items-center gap-2 mt-1">
                <div class="rounded-full bg-camber/40 blink" style="width:5px;height:5px;"></div>
                <span style="font-size:9px;" class="tracking-[0.2em] uppercase text-camber/20">returning to scanner</span>
              </div>
            </div>
          </template>

          <!-- DEFAULT TIMEOUT / SIGNAL LOST -->
          <template x-if="!resultReason || (resultReason !== 'already_looted' && resultReason !== 'no_loot' && resultReason !== 'cooldown' && resultReason !== 'already_hacking')">
            <div class="flex flex-col items-center gap-3">
              <div class="relative">
                <svg class="text-cred result-icon" style="width:72px;height:72px;" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286zm0 13.036h.008v.008H12v-.008z"/>
                </svg>
                <div class="absolute inset-0 rounded-full bg-cred/5 glitch-bg"></div>
              </div>
              <div style="font-size:34px;" class="font-black tracking-[0.15em] text-cred result-glitch glow-red">TIMEOUT</div>
              <div class="bg-cred/20" style="width:60px;height:1px;"></div>
              <div style="font-size:12px;" class="tracking-[0.2em] uppercase text-cred/25" x-text="resultReason || 'connection dropped'"></div>
              <div class="flex items-center gap-2 mt-1">
                <div class="rounded-full bg-cred/40 blink" style="width:5px;height:5px;"></div>
                <span style="font-size:9px;" class="tracking-[0.2em] uppercase text-cred/20">returning to scanner</span>
              </div>
            </div>
          </template>

        </div>
      </template>
    </div>

  </div><!-- /safe-area -->

</body>
<script src="app.js"></script>
</html>
